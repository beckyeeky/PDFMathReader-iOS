name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        default: Release
        type: choice
        options: [Release, Debug]
      xcode:
        description: Xcode app version suffix (empty = image default)
        default: "27.0"
        type: string
      runner:
        description: Runner label
        default: xcode-27
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'beckyeeky/PDFMathReader-iOS'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "${{ inputs.xcode }}" ] && XC=/Applications/Xcode_${{ inputs.xcode }}.app
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          ( sleep 600; echo "=== WATCHDOG: still running after 10 min ==="; ps -Ao pid,etime,args | grep swift-frontend | grep -v grep | while read pid et rest; do echo "PID $pid ELAPSED $et"; sample $pid 3 2>/dev/null | grep -E "swift::|llvm::" | head -60; echo "$rest" | tr ' ' '\n' | grep -A1 -E '^-primary-file$' | grep -v -- '-primary-file' | grep -v -- '--'; done; ps -Ao etime,args | grep -E "SwiftCompile|actool|ibtool|ld " | grep -v grep | cut -c1-300; tail -40 "$RUNNER_TEMP/build.log"; pkill -f xcodebuild ) &
          WD=$!
          xcodebuild archive \
            -project PDFMathReader.xcodeproj \
            -scheme PDFMathReader \
            -configuration ${{ inputs.configuration }} \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PDFMathReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            > "$RUNNER_TEMP/build.log" 2>&1 || { kill $WD 2>/dev/null; grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -50; tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          kill $WD 2>/dev/null || true
          grep -E "^\*\* ARCHIVE" "$RUNNER_TEMP/build.log"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/PDFMathReader.xcarchive/Products/Applications/PDFMathReader.app"
          ls "$APP"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../PDFMathReader-unsigned.ipa Payload
          cd .. && ls -lh PDFMathReader-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.configuration }}
          path: ${{ runner.temp }}/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMathReader-unsigned-ipa
          path: PDFMathReader-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-${{ inputs.configuration }}"
          gh release create "$TAG" PDFMathReader-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Unsigned IPA $TAG" \
            --notes "Unsigned build from upstream commit $GITHUB_SHA. Re-sign with SideStore/AltStore/LiveContainer etc."
